name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-conventions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the pinned validation tools
        shell: bash
        run: |
          archive="$RUNNER_TEMP/nils-cli.tar.gz"
          url=$(python3 -c 'import json; print(json.load(open("manifest.json"))["components"]["nils-cli"]["url"])')
          checksum=$(python3 -c 'import json; print(json.load(open("manifest.json"))["components"]["nils-cli"]["sha256"])')
          curl --fail --location --retry 3 --silent --show-error "$url" -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/nils-cli"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/nils-cli"
          echo "$RUNNER_TEMP/nils-cli/bin" >> "$GITHUB_PATH"
      - name: Repository conventions
        run: .agents/scripts/pre-pr.sh
  sandbox-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Unit regressions
        run: make test
      - name: Build the authenticated pinned image
        run: make build
      - name: Boot confined systemd, accept installation, and run offline scenarios
        run: sudo make acceptance
      - name: Preserve the machine-readable scenario result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scenario-results
          path: .cache/scenario-results.json
          if-no-files-found: warn
